<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Units Practise</title>
    <style>
        h2 {
            text-align: center;
            text-size-adjust: 200px;
            font-size: 40px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            display: flex;
            gap: 1rem;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            justify-content: center;

        }

        .fir {
            border: 9px solid rgb(77, 182, 77);
            padding: 2rem;
            background-color: rgb(77, 182, 77);
            width: 90px;
            height: 21em;
            color: white;
            border-radius: 15px;
        }

        .sec {
            border: 9px solid rgb(77, 182, 77);
            padding: 2rem;
            background-color: rgb(77, 182, 77);
            width: 90px;
            height: 9em;
            color: white;
            border-radius: 15px;
        }

        .tri {
            border: 9px solid rgb(77, 182, 77);
            padding: 2rem;
            background-color: rgb(77, 182, 77);
            width: 8%;
            height: 0.1%;
            color: white;
            border-radius: 15px;
        }

        .for {
            border: 9px solid rgb(77, 182, 77);
            padding: 2rem;
            background-color: rgb(77, 182, 77);
            width: 15vmin;
            height: 58vmin;
            color: white;
            border-radius: 15px;
        }

        .fiv {
            border: 9px solid rgb(77, 182, 77);
            padding: 2rem;
            background-color: rgb(77, 182, 77);
            width: 8em;
            height: 20.em;
            color: white;
            border-radius: 15px;
        }
    </style>
</head>

<body>
    <h2>CSS Units Practise</h2>
    <div class="container">
        <div class="fir">This box uses <strong>rem</strong> for padding and <strong>px</strong> for width</div>
        <div class="sec">This box uses <strong>vw</strong> for width and <strong>vh</strong> for height</div>
        <div class="tri">This box uses <strong>%</strong> for widht and height</div>
        <div class="for">This box uses <strong>vmin</strong> for widht and height</div>
        <div class="fiv">This box uses <strong>em</strong> for widht and height</div>
    </div>
</body>

</html>
