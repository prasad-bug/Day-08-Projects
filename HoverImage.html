<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Hover Effects</title>
</head>
<style>
    body {
    font-family: sans-serif;
    background: #f2f2f2;
    text-align: center;
    padding: 2rem;
  }
  
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    max-width: 800px;
    margin: auto;
  }
  
  .img-container {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }
  
  .img-container img {
    width: 100%;
    display: block;
    transition: all 0.4s ease;
  }
  
  .zoom:hover img {
    transform: scale(1.1);
  }
  
  .rotate:hover img {
    transform: rotate(10deg);
  }
  
  .grayscale img {
    filter: grayscale(100%);
    transition: filter 0.4s ease;
  }
  .grayscale:hover img {
    filter: grayscale(0%);
  }
  
  .text-reveal .caption {
    position: absolute;
    bottom: 0;
    background: rgba(0,0,0,0.7);
    color: white;
    width: 100%;
    padding: 0.5rem;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  
  .text-reveal:hover .caption {
    opacity: 1;
  }
  
</style>
<body>
  <h1>Hover Image Gallery</h1>
  <div class="gallery">
    <div class="img-container zoom">
      <img src="https://imgs.search.brave.com/KfYqJqiy5iYFfIdtUopTzWmRtx9a4IePw1-Q9deP_kk/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9kaWdp/dGFsc3lub3BzaXMu/Y29tL3dwLWNvbnRl/bnQvdXBsb2Fkcy8y/MDE4LzA3L2Nhci1s/b2dvcy1mb3JkLmpw/Zw" alt="Zoom">
    </div>
    <div class="img-container rotate">
      <img src="https://imgs.search.brave.com/iEHTPCLY6j6B_YrNIP8CdX-C4bcNtLL80pgKFODZ85U/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9sb2dv/cG9wcGluLmNvbS93/cC1jb250ZW50L3Vw/bG9hZHMvMjAyNC8w/NS9CTVctbG9nby53/ZWJw" alt="Rotate">
    </div>
    <div class="img-container grayscale">
      <img src="https://imgs.search.brave.com/LlwmdnuqJFQUjcEHTJgzIN9_CBpbNOLHJa1OUdBtDL4/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly93d3cu/Y2FybG9nb3Mub3Jn/L2xvZ28vQnVnYXR0/aS1sb2dvLnBuZw" alt="Grayscale">
    </div>
    <div class="img-container text-reveal">
      <img src="https://imgs.search.brave.com/xb3ZzZhcobRPmB_gMlFm5_vfcYBMuoqun1jW0-ZY7Ro/rs:fit:500:0:0:0/g:ce/aHR0cHM6Ly90NC5m/dGNkbi5uZXQvanBn/LzAwLzc1LzkyLzIz/LzM2MF9GXzc1OTIy/MzM2X0p6MlFnTk94/N2RuUmVhOVpJNnlR/VER0bjF2SHE1ZWpG/LmpwZw" alt="Text Reveal">
      <div class="caption">CSS !</div>
    </div>
  </div>
</body>
</html>
